<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>betsim desk</title><meta name=theme-color content="#0d1117"><style>
body{margin:0;font:14px -apple-system,system-ui,sans-serif;background:#0d1117;color:#e6edf3}header{position:sticky;top:0;background:#161b22;padding:8px 10px;z-index:2}
h1{font-size:17px;margin:0}small{color:#8b949e}nav{display:flex;gap:4px;overflow:auto;margin-top:6px}nav button{flex:1;background:#21262d;color:#e6edf3;border:0;border-radius:6px;padding:7px 6px;white-space:nowrap}
nav button.on{background:#1f6feb}main{padding:10px}.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}select,input{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:5px}
.c{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;margin-bottom:8px}.best{border-color:#2ea043}.t{font-weight:600}.m{color:#8b949e;font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:4px;background:#30363d}.A{background:#238636}.B{background:#9e6a03}.C{background:#30363d}.BEST{background:#1f6feb}
.W{color:#3fb950}.L{color:#f85149}.neg{color:#f85149}.pos{color:#3fb950}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #30363d;padding:4px;text-align:left}
.kp{display:flex;gap:8px;flex-wrap:wrap}.kp div{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px;flex:1;min-width:90px}.kp b{display:block;font-size:18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}.cl{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:6px;font-size:12px;position:relative;min-width:0}
.cl b{display:none}.sm{font-weight:600;font-size:13px;word-break:break-word}.cl.tp{border-color:#2ea043;background:#0f2a17}.tg{display:inline-block;margin-top:3px;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700}
.tg.tp{background:#2ea043}.tg.tl{background:#9e6a03}.tg.tx{background:#30363d;color:#8b949e}.ctx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tk .ctx:active{white-space:normal}.offrec{border-color:#1f6feb;text-align:center}.offrec .big{font-size:40px;font-weight:800;line-height:1.1}.pill.LEAN{background:#8957e5}.void{opacity:.7;border-color:#f85149}.void .t{text-decoration:line-through}.vd{color:#f85149;font-weight:700;font-size:12px;margin-bottom:4px}.pill.VOID{background:#da3633}</style></head><body><header><h1>betsim desk</h1><small id=gen></small><nav id=nav></nav></header><main id=main>Loading…</main><script>
const TABS=["Today","All Games","Props","Ledger","Method"];let D,tab=TABS.find(t=>t.replace(" ","")==decodeURIComponent(location.hash.slice(1)))||"Today";const $=s=>document.querySelector(s);
function short(b,t){const [a,h]=t.matchup.split(' @ ');const nm=x=>x.split(' ').slice(-1)[0];return b.replace(a,nm(a)).replace(h,nm(h))}
const pct=x=>x==null?"–":(100*x).toFixed(1)+"%",am=x=>x==null?"–":(x>0?"+":"")+Math.round(x),pts=x=>x==null?"–":(x>=0?"+":"")+(100*x).toFixed(1);
fetch("data/desk.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;$("#gen").textContent="Generated "+d.generated_ct+" · 1u = $20 flat · picks are information only";nav();render()});
function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';location.hash='${t.replace(' ','')}';nav();render()">${t}</button>`).join("")}
function rec(items){let w=0,l=0,p=0,v=0,u=0;items.forEach(i=>{if(i.status=="W")w++;if(i.status=="L")l++;if(i.status=="P")p++;if(i.status=="VOID")v++;u+=+(i.units||0)});return{w,l,p,v,u}}
function kp(items,label){const r=rec(items);const n=r.w+r.l+r.p;return`<div><small>${label}</small><b>${r.w}-${r.l}-${r.p}</b><small>${r.u>=0?'+':''}${r.u.toFixed(2)}u · $${(r.u*20).toFixed(0)} · ROI ${n?(100*r.u/n).toFixed(1)+'%':'–'}${r.v?' · '+r.v+' void':''}</small></div>`}
function card(r){return`<div class="c ${r.level=='BEST'?'best':''} ${r.level=='VOID'?'void':''}">${r.level=='VOID'?`<div class=vd>VOIDED — ${(r.note||'').replace('VOID: ','')} · $0 risked</div>`:''}<span class="pill ${r.level}">${r.level}</span><span class=pill>${r.sport}</span><span class=t>${r.pick}</span>
<div class=m>${r.game} · ${r.kick_ct?new Date(r.kick_ct).toLocaleString('en-US',{timeZone:'America/Chicago',weekday:'short',hour:'numeric',minute:'2-digit'})+' CT':''}</div>
${r.skip?'<div class=neg><b>SKIP — CFB spread/total, no official picks today (paper only)</b></div>':''}<div>${r.pct_label?'Market fair %':'Hit'} ${pct(r.hit_prob)}${r.research_shrunk?' <span class=m>(shrunk 0.25 model/0.75 market; raw '+pct(r.hit_prob_raw)+')</span>':''}${r.hit_prob_model!=null&&r.hit_prob_model!=r.hit_prob&&!r.pct_label?' <span class=m>(model '+pct(r.hit_prob_model)+')</span>':''}${r.mkt_nv!=null?' · mkt '+pct(r.mkt_nv):''} · price <b>${am(r.price)}</b> ${r.book||'(no real price)'}${r.book_note?' <span class=m>('+r.book_note+')</span>':''} · break-even ${pct(r.breakeven)} · edge <span class="${r.edge<0?'neg':'pos'}">${pts(r.edge)}</span></div>${r.trust?'<div class=m>Confidence tier: '+r.trust+'</div>':''}${r.timing?'<div class=m>⏱ '+r.timing+'</div>':''}
${r.context?`<div class=m>${r.context}</div>`:''}${r.type=='game'?rn(r.game):''}${r.excluded&&r.level!='BEST'?`<div class=m>Not BEST: ${r.excluded}</div>`:''}</div>`}
function filt(rows,keys){const f=window.F||{};return rows.filter(r=>(!f.sport||r.sport==f.sport)&&(!f.market||r.market==f.market)&&(f.edge==null||f.edge===''||(r.edge??r.edge_vs_breakeven??-9)>=f.edge/100)&&(!f.q||JSON.stringify(r).toLowerCase().includes(f.q.toLowerCase())))}
function filters(rows){const sp=[...new Set(rows.map(r=>r.sport))],mk=[...new Set(rows.map(r=>r.market))];const f=window.F||{};
return`<div class=f><select onchange="F.sport=this.value;render()"><option value="">All sports</option>${sp.map(s=>`<option ${f.sport==s?'selected':''}>${s}</option>`).join('')}</select>
<select onchange="F.market=this.value;render()"><option value="">All markets</option>${mk.map(s=>`<option ${f.market==s?'selected':''}>${s}</option>`).join('')}</select>
<input type=number placeholder="min edge pts" style="width:110px" value="${f.edge??''}" onchange="F.edge=this.value;render()"><input placeholder="search team/player" value="${f.q||''}" onchange="F.q=this.value;render()"></div>`}
window.F={};
function chart(items){const g=items.filter(i=>["W","L","P"].includes(i.status)).sort((a,b)=>(a.graded_ct||'').localeCompare(b.graded_ct||''));if(!g.length)return'<div class=m>No graded picks yet — chart appears after the first results.</div>';
let c=0,pts=g.map(i=>c+=+i.units),mn=Math.min(0,...pts),mx=Math.max(0,...pts),W=320,Hh=110,x=i=>i*(W/(Math.max(pts.length-1,1))),y=v=>Hh-(v-mn)/(mx-mn||1)*Hh;
return`<svg viewBox="0 0 ${W} ${Hh}" width=100% height=120><line x1=0 x2=${W} y1=${y(0)} y2=${y(0)} stroke=#30363d /><polyline fill=none stroke=#3fb950 stroke-width=2 points="${pts.map((v,i)=>x(i)+','+y(v)).join(' ')}"/></svg><div class=m>Cumulative units (official+research), ${g.length} graded</div>`}
function none(rows,label){const have=new Set(rows.map(r=>r.sport));const miss=D.sports.filter(s=>!have.has(s));return miss.length?`<div class=m>No ${label} today (${D.today}): ${miss.join(', ')}</div>`:''}
function asof(){const a=D.odds_asof||{};const today=Object.entries(a).filter(([k,v])=>v&&v.startsWith(D.today));return`<div class=m>Odds as of: ${today.length?today.map(([k,v])=>k.replace(/ via.*/,'')+' '+new Date(v).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'})+' CT').join(' · '):'no Odds API pull today (ESPN/Action Network prices)'}</div>`}
function rn(mu){const n=(D.research||{})[mu]||(D.research||{})[mu.replace(' (N)','')];if(!n||!n.length)return'';return`<details class=m style="margin-top:4px"><summary>📰 Research (${n.length}) — ✅ confirmed feeds model · 🟡 beat · ❔ rumor · 💬 opinion (note only)</summary>${n.map(x=>`<div>${x.url&&x.url.length>16?`<a style="color:#58a6ff" href="${x.url}" target=_blank>${x.text}</a>`:x.text}${x.model?' <b style="display:inline;color:#3fb950">MODEL</b>':''}</div>`).join('')}</details>`}
function render(){const m=$("#main");if(tab=="Today"){const b=D.card.filter(r=>r.level=="BEST"||r.level=="VOID"),o=D.card.filter(r=>["A","B","C"].includes(r.level)).sort((a,b)=>a.level.localeCompare(b.level)||b.hit_prob-a.hit_prob);
const off=D.ledger.filter(i=>i.kind=="official"),res=D.ledger.filter(i=>i.kind=="research");
const ro=rec(off),no=ro.w+ro.l+ro.p;
m.innerHTML=`<div class="c offrec"><small>OFFICIAL RECORD — BEST picks, $20 flat</small><div class=big>${ro.w}-${ro.l}${ro.p?'-'+ro.p:''}</div><div class="${ro.u<0?'neg':'pos'}" style="font-size:18px;font-weight:700">${ro.u>=0?'+':''}${ro.u.toFixed(2)}u · ${ro.u<0?'-':'+'}$${Math.abs(ro.u*20).toFixed(2)}</div><small>ROI ${no?(100*ro.u/no).toFixed(1)+'%':'–'} · ${off.filter(i=>i.status=='OPEN').length} open${ro.v?' · '+ro.v+' void':''}</small></div>
<div class=m>Research leans (not official): ${(()=>{const r=rec(res);return r.w+'-'+r.l+(r.p?'-'+r.p:'')+' · '+(r.u>=0?'+':'')+r.u.toFixed(2)+'u'})()}</div>${(()=>{const T=D.teaser||{};if(!T.legs||!T.legs.length){const TT0=D.teaser_tickets||[];if(!TT0.length)return'';T.legs=[];}const be=Object.entries(T.break_even).map(([k,v])=>k+'-team '+(T.payouts[k]>0?'+':'')+T.payouts[k]+' → '+(v*100).toFixed(1)+'%').join(' · ');const lg=x=>`<div class=c><b>${x.pick}</b> <span class=m>(${x.sport} · ${x.game} · from ${x.market=='spread'&&x.orig_line>0?'+':''}${x.orig_line})</span><br>est leg hit ${(x.est_hit*100).toFixed(0)}% · ${x.rule_desc} · disc ${x.disc} / holdout ${x.hold}</div>`;const t=T.ticket;const TT=D.teaser_tickets||[];const tks=TT.length?`<h3>🏈 Teaser tickets — 4-team 6 pt +300 (paper only, max 3 tickets per leg)</h3><div class="c" style="border-color:#d29922"><b>${(D.rules||{}).teaser_label||'PAPER ONLY'}</b></div>`+TT.map((t,i)=>`<div class=c><b>#${i+1}</b> ${t.legs.join(' / ')}<br><span class=m>win ~${(t.win*100).toFixed(1)}% · EV $${t.ev20>=0?'+':''}${t.ev20}${t.below_be?' · below break-even':''}</span></div>`).join(''):'';return tks+`<h3>🏈 Teaser legs — 6 pt, not official</h3><div class="c" style="border-color:#d29922"><b>${(D.rules||{}).teaser_label||'PAPER ONLY'}</b></div><div class=m>Break-even per leg: ${be}</div>${T.legs.map(lg).join('')}${t?`<div class=c><b>Suggested 4-team +300:</b> ${t.legs.map(x=>x.pick).join(' / ')}<br>est cash ${(t.est_cash*100).toFixed(0)}% · est ROI ${(t.est_roi>=0?'+':'')+(t.est_roi*100).toFixed(0)}%${T.alternates.length?'<br>Alternates: '+T.alternates.map(x=>x.pick).join(', '):''}</div>`:`<div class=m>Only ${T.legs.length} leg(s) qualify — no 4-team ticket today.</div>`}`})()}<h3>⭐ Top Leans — not official, $20 flat, tracked separately</h3><div class=m>Best research picks by calibrated edge vs best real price. Record: ${(()=>{const r=rec(D.ledger.filter(i=>i.kind=='lean'));return r.w+'-'+r.l+(r.p?'-'+r.p:'')+' · '+(r.u>=0?'+':'')+r.u.toFixed(2)+'u'})()}</div>${(()=>{const t=D.card.filter(r=>r.top_lean);return t.length?t.map(r=>card({...r,level:'LEAN'})).join(''):'<div class=c>No lean with positive calibrated edge today.</div>'})()}
${asof()}<h3>Official picks — today ${D.today} (positive EV, max 8)</h3>${none(D.games,'games')}${b.length?b.map(card).join(''):'<div class=c>No play qualifies today. Passing is a result.</div>'}
<h3>Other leans (research)</h3>${filters(o)}${filt(o).map(card).join('')}`}
else if(tab=="All Games"){const f=window.F||{};const byG={};D.games.forEach(g=>{(byG[g.matchup]=byG[g.matchup]||{sport:g.sport,matchup:g.matchup,proj:g.proj_score,ctx:g.context,src:g.src,mk:{}}).mk[g.market]=g});
let T=Object.values(byG).filter(t=>(!f.sport||t.sport==f.sport)&&(!f.market||t.mk[f.market])&&(f.edge==null||f.edge===''||Object.values(t.mk).some(g=>(g.edge_vs_breakeven??-9)>=f.edge/100))&&(!f.q||JSON.stringify(t).toLowerCase().includes(f.q.toLowerCase())));
const kick=m=>{const c=D.card.find(r=>r.game==m&&r.kick_ct);return c?c.kick_ct:null};T.sort((a,b)=>(kick(a.matchup)||'').localeCompare(kick(b.matchup)||''));
const tag=(t,g)=>{const c=D.card.find(r=>r.type=='game'&&r.game==t.matchup&&r.market==g.market);const lv=c?c.level:'-';return lv=='BEST'?['PICK','tp']:(lv=='A'||lv=='B')?['LEAN','tl']:['PASS','tx']};
const cell=(t,k,lab)=>{const g=t.mk[k];if(!g)return`<div class=cl><div class=m>${lab}</div><div class=m>–</div></div>`;const [tg,cls]=tag(t,g);const dim=f.market&&f.market!=k?' style="opacity:.45"':'';
return`<div class="cl ${cls}"${dim}><div class=m>${lab}</div><b>${g.bet.replace(t.matchup.split(' @ ')[0],'').replace(t.matchup.split(' @ ')[1],'').trim()||g.bet}</b><div class=sm>${short(g.bet,t)}</div><div>${am(g.best_price??g.price)} <span class=m>${g.best_book||(g.price_assumed?'assumed':'')}</span></div>${(()=>{const c=D.card.find(r=>r.type=='game'&&r.game==t.matchup&&r.market==g.market);const hp=c?c.hit_prob:g.hit_prob;const tr=c&&c.trust?c.trust:'';const col=tr.startsWith('TRUSTED')?'#2ea043':tr.startsWith('ROUGH')?'#d29922':'#8b949e';const sk=c&&c.skip;return (sk?'<div class=neg><b>SKIP</b></div>':'')+`<div class=m>${c&&c.pct_label?'mkt fair':'hit'} ${pct(hp)}</div>`+(tr?`<div class=sm style="color:${col}">${tr.split(':')[0]}</div>`:'')})()}<div class="${(g.edge_vs_breakeven??0)<0?'neg':'pos'}">${pts(g.edge_vs_breakeven)}</div><span class="tg ${cls}">${tg}</span></div>`};
const any=t=>Object.values(t.mk).some(g=>tag(t,g)[0]=='PICK');
m.innerHTML=`<h3>Today's games — ${D.today}</h3>`+asof()+none(D.games,'games')+filters(D.games)+`<div class=m>${T.length} games · Bovada lines/prices (DraftKings shown only when Bovada is missing) · PICK = BEST card, LEAN = tier A/B, PASS = no qualifying edge</div>`+
T.map(t=>{const k=kick(t.matchup);return`<div class="c tk ${any(t)?'best':''}"><div><span class=pill>${t.sport}</span><span class=t>${t.matchup}</span></div><div class=m>${k?new Date(k).toLocaleString('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'})+' CT · ':''}proj ${t.proj||''}${t.src&&t.src.includes('PRESEASON')?' · PRESEASON':''}</div>
<div class=g3>${cell(t,'spread','Spread')}${cell(t,'ml','Moneyline')}${cell(t,'total','Total')}</div><div class="m ctx">${(t.ctx||'').replace(/injuries=/,'🩹 ').replace(/goalies=/,'🥅 ').replace(/wind=/,'🌬 wind ').replace(/ \|\| /g,' | ')}</div>${rn(t.matchup)}</div>`}).join('')}
else if(tab=="Props"){const r=filt(D.props.map(p=>({...p,edge:p.edge})));m.innerHTML=`<h3>Today's props — ${D.today}</h3>`+asof()+none(D.props,'props')+filters(D.props)+`<table><tr><th>Player</th><th>Prop</th><th>Pick</th><th>Hit</th><th>DK</th><th>BE</th><th>Edge</th></tr>${r.sort((a,b)=>b.hit_prob-a.hit_prob).map(p=>`<tr><td>${p.player}<div class=m>${p.game} · ${p.team}${p.injury_status?' · '+p.injury_status:''}</div></td><td>${p.market} ${p.dk_line??p.line}</td><td>${p.pick}</td><td>${pct(p.hit_prob)}</td><td>${am(p.dk_price)}</td><td>${pct(p.breakeven)}</td><td class="${p.edge<0?'neg':'pos'}">${pts(p.edge)}<div class=m>${p.juice_flag||''}</div></td></tr>`).join('')}</table>`}
else if(tab=="Ledger"){const L=[...D.ledger].sort((a,b)=>(b.kick_ct||'').localeCompare(a.kick_ct||''));m.innerHTML=`<div class=kp>${kp(L.filter(i=>i.kind=='official'),'Official')}${kp(L.filter(i=>i.kind=='research'),'Research')}${kp(L.filter(i=>i.kind=='lean'),'Top Leans')}${kp(L.filter(i=>i.kind=='teaser'),'Teasers (paper only)')}</div>
<div class=kp style="margin-top:6px">${kp(L.filter(i=>i.kind=='all_games'&&!i.preseason),'Model picks every game (ML+spread+total)')}</div>${chart(L.filter(i=>i.kind!='all_games'))}
<table><tr><th>Date</th><th>Pick</th><th>Price</th><th>Hit</th><th>Result</th><th>u</th></tr>${L.map(i=>`<tr><td>${i.date}<div class=m>${i.kind}</div></td><td>${i.pick}<div class=m>${i.game}${i.void_reason?' · '+i.void_reason:''}</div></td><td>${am(i.price)}</td><td>${pct(i.hit_prob)}</td><td class=${i.status}>${i.status}${i.actual!=null?' ('+i.actual+')':''}</td><td>${i.units??''}</td></tr>`).join('')}</table>`}
else{const r=D.card_meta.rules||{};m.innerHTML=`<div class=c><b>Official rules</b><div class=m>${r.rule||''} · price no worse than ${r.worst_price} (except ${(r.filter_price_exempt||[]).join(', ')}) · max ${r.max_per_day}/day · flat $20 · no parlays · ${r.calibration||''}</div>
<div class=m>Eligible markets: ${Object.entries(r.prop_markets||{}).map(([k,v])=>k+' ('+v+')').join('; ')}; game filters: ${(r.game_filters||[]).join(', ')}</div><div class=m>Excluded: ${(r.excluded||[]).join(', ')}</div>
<div class=m>Tiers: A = hit ≥60% & edge ≥3; B = hit ≥55% & edge ≥0; C = weaker or unpriced. Research only.</div><div class=m>Recheck before kickoff voids a pick if its price moved past break-even or the player is ruled Out.</div></div>
<h3>Game backtests (out of sample)</h3><table><tr>${Object.keys(D.backtest[0]||{}).slice(0,8).map(k=>`<th>${k}</th>`).join('')}</tr>${D.backtest.slice(0,40).map(r=>`<tr>${Object.values(r).slice(0,8).map(v=>`<td>${typeof v=='number'?Math.round(v*1000)/1000:v??''}</td>`).join('')}</tr>`).join('')}</table>
<h3>Props backtests</h3><table><tr>${Object.keys(D.props_backtest[0]||{}).slice(0,8).map(k=>`<th>${k}</th>`).join('')}</tr>${D.props_backtest.slice(0,40).map(r=>`<tr>${Object.values(r).slice(0,8).map(v=>`<td>${typeof v=='number'?Math.round(v*1000)/1000:v??''}</td>`).join('')}</tr>`).join('')}</table>
<h3>Filters (discovery vs holdout)</h3><table><tr><th>sport</th><th>filter</th><th>holdout n</th><th>hit</th><th>ROI</th><th>holds</th></tr>${D.filters.map(f=>`<tr><td>${f.sport}</td><td>${f.filter}</td><td>${f.hold_n}</td><td>${pct(f.hold_hit)}</td><td>${pct(f.hold_roi)}</td><td>${f.holds}</td></tr>`).join('')}</table>
<h3>Odds API credits (latest)</h3><table>${D.credits.slice(-15).reverse().map(c=>`<tr><td>${c.ts_ct}</td><td>${c.label}</td><td>${c.cost}</td><td>${c.remaining??c.skipped??''}</td></tr>`).join('')}</table>`}}
</script></body></html>
